<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%icons/icon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="%BASE_URL%icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%icons/icon-180.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="description" content="知间 AI（KnowFlow）— 你的个人知识与行动中心，AI 万能资料管家。" />
    <!-- 安全策略：禁止内联脚本执行、禁止对象嵌入、禁止被 iframe 嵌套 -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: ws: wss: http://localhost:* http://127.0.0.1:*; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>知间 AI · KnowFlow</title>
    <style>
      /* 首屏骨架：JS 下载+解析期间先把版式立起来，避免 1 秒多的白屏。
         挂载后 Vue 会整体替换 #app 的内容，这里只是「占位」。
         内联是有意的：CSP 允许 style-src 'unsafe-inline'，且它必须在 CSS 文件到达前就生效。 */
      html, body { margin: 0; background: #f8fafc; }
      .kf-boot {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 14px; height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      .kf-boot-logo { font-size: 20px; font-weight: 700; color: #2b58d8; letter-spacing: 0.5px; }
      .kf-boot-bar { width: 96px; height: 3px; border-radius: 999px; background: #e2e8f0; overflow: hidden; }
      .kf-boot-bar i {
        display: block; width: 40%; height: 100%; border-radius: 999px;
        background: #3b6ef6; animation: kf-boot-run 1.1s ease-in-out infinite;
      }
      .kf-boot-hint { font-size: 12px; color: #94a3b8; }
      @keyframes kf-boot-run {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(260%); }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="kf-boot">
        <div class="kf-boot-logo">知间 AI</div>
        <div class="kf-boot-bar"><i></i></div>
        <div class="kf-boot-hint">正在打开你的资料库…</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
